# Alembic configuration.
# The database URL is NOT set here: alembic/env.py reads it from
# app.core.config.Settings (env var SAL_DATABASE_URL), so there is one source
# of truth for configuration.

[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
path_separator = os

[post_write_hooks]
# Keep generated migrations consistent with the rest of the codebase.
hooks = ruff_format, ruff_fix
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
